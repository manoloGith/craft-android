name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for eframe's host tests
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libx11-dev libwayland-dev libgtk-3-dev pkg-config
      - run: rustup show
      - run: cargo test --workspace --locked
      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;29.0.14206865"
      - name: Clippy for Android
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          cargo ndk -t arm64-v8a clippy --locked -p craft-android -- -D warnings

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build craft-activity
        working-directory: android
        run: ./gradlew --no-daemon :craft-activity:assembleRelease
